<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Gestor de Tareas</ion-title>
  </ion-toolbar>
  <ion-toolbar color="primary">
    <ion-searchbar [(ngModel)]="busqueda" (ionInput)="filtrar()" placeholder="Buscar tarea..."></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Pull to refresh -->
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content pullingText="Desliza para actualizar..." refreshingSpinner="circles">
    </ion-refresher-content>
  </ion-refresher>

  <ion-list>
    <!-- Item sliding para Swipe Delete -->
    <ion-item-sliding *ngFor="let t of tareasFiltradas" #slidingItem>
      <ion-item>
        <ion-checkbox slot="start" [checked]="t.completada === 1" (ionChange)="toggleCompletada(t)"></ion-checkbox>
        <ion-label [class.completada]="t.completada === 1">
          <h2>{{ t.titulo }}</h2>
          <p *ngIf="t.descripcion">{{ t.descripcion }}</p>
        </ion-label>
        <ion-badge slot="end" [color]="t.prioridad === 'alta' ? 'danger' : t.prioridad === 'media' ? 'warning' : 'medium'">
          {{ t.prioridad }}
        </ion-badge>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="eliminar(t, slidingItem)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <!-- Botón flotante para agregar tarea -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="abrirModalNuevaTarea()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
