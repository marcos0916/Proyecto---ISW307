<ion-header>
  <ion-toolbar>
    <ion-title>Servicios de Localización</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="accion-row">
    <ion-button fill="solid" (click)="locateMe()">Mi ubicación</ion-button>
    <ion-button fill="outline" color="success" (click)="startTracking()" [disabled]="isTracking">
      Iniciar tiempo real
    </ion-button>
    <ion-button fill="outline" color="medium" (click)="stopTracking()" [disabled]="!isTracking">
      Detener tiempo real
    </ion-button>
  </div>

  <div id="map"></div>

  <ion-text *ngIf="coordsText" color="medium">
    <p class="coords-text">{{ coordsText }}</p>
  </ion-text>

  <div class="notes-section">
    <p class="app-list-eyebrow">Notas</p>

    <div class="note-input">
      <input
        type="text"
        placeholder="Escribe una tarea o nota..."
        [(ngModel)]="noteText"
        (keyup.enter)="saveNote()"
      />
      <ion-button (click)="saveNote()">Guardar</ion-button>
    </div>

    <div class="app-list">
      <div class="app-list-item note-item" *ngFor="let note of notes">
        <div class="note-content">
          <span class="app-list-title note-text">{{ note.text }}</span>
          <span class="note-date">{{ note.date | date: 'dd/MM/yy, h:mm a' }}</span>
        </div>
        <span class="note-status">Sincronizado</span>
      </div>
    </div>
  </div>
</ion-content>
