<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Offline Sync App</ion-title>
    <ion-badge
      slot="end"
      [color]="(isOnline$ | async) ? 'success' : 'danger'"
      style="margin-right: 15px; padding: 6px 12px; font-size: 0.85rem;"
    >
      {{ (isOnline$ | async) ? 'En línea' : 'Sin conexión' }}
    </ion-badge>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-item lines="none" style="border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px;">
    <ion-input
      placeholder="Escribe una tarea o nota..."
      [(ngModel)]="newItemTitle"
      (keyup.enter)="saveItem()"
    ></ion-input>
    <ion-button slot="end" (click)="saveItem()">Guardar</ion-button>
  </ion-item>

  <ion-list>
    <ion-item *ngFor="let item of (items$ | async)">
      <ion-label>
        <h2>{{ item.title }}</h2>
        <p>{{ item.createdAt | date:'short' }}</p>
      </ion-label>
      <ion-badge slot="end" [color]="item.synced ? 'success' : 'warning'">
        {{ item.synced ? 'Sincronizado' : 'Pendiente' }}
      </ion-badge>
    </ion-item>
  </ion-list>
</ion-content>
