<ion-header>
  <ion-toolbar>
    <ion-title>Servicios de Localización</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-button expand="block" (click)="locateMe()">Mi ubicación</ion-button>
  <ion-button expand="block" color="success" (click)="startTracking()" [disabled]="isTracking">
    Iniciar tiempo real
  </ion-button>
  <ion-button expand="block" color="medium" (click)="stopTracking()" [disabled]="!isTracking">
    Detener tiempo real
  </ion-button>

  <div id="map"></div>

  <ion-text *ngIf="coordsText">
    <p>{{ coordsText }}</p>
  </ion-text>

  <div class="notes-section">
    <div class="note-input">
      <input
        type="text"
        placeholder="Escribe una tarea o nota..."
        [(ngModel)]="noteText"
        (keyup.enter)="saveNote()"
      />
      <ion-button (click)="saveNote()">GUARDAR</ion-button>
    </div>

    <div class="note-item" *ngFor="let note of notes">
      <div class="note-content">
        <span class="note-text">{{ note.text }}</span>
        <span class="note-date">{{ note.date | date: 'dd/MM/yy, h:mm a' }}</span>
      </div>
      <span class="note-status">Sincronizado</span>
    </div>
  </div>
</ion-content>
