<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Mi Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card>
    <ion-card-header>
      <div class="avatar">
        <ion-icon name="person"></ion-icon>
      </div>
      <ion-card-title>Datos del estudiante</ion-card-title>
      <ion-card-subtitle>Se guardan en este dispositivo</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-input
          label="Nombre completo"
          labelPlacement="stacked"
          placeholder="Tu nombre"
          [(ngModel)]="nombre">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Carrera"
          labelPlacement="stacked"
          placeholder="Tu carrera"
          [(ngModel)]="carrera">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Correo"
          labelPlacement="stacked"
          type="email"
          placeholder="tucorreo@uapa.edu.do"
          [(ngModel)]="correo">
        </ion-input>
      </ion-item>

      <ion-button expand="block" (click)="guardarPerfil()">
        Guardar perfil
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
